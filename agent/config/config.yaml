portal:
  title: Home.Lan
  subtitle: Servicos da rede local · 10.0.0.0/24
  groups:
  - id: lenovo
    title: Lenovo ThinkStation P720
    subtitle: AI Lab · 10.0.0.3
    accent: '#22c55e'
    accent_light: '#15803d'
    order: 0
  - id: dell
    title: Dell T430
    subtitle: Proxmox · 10.0.0.2 · LXCs e VMs
    accent: '#4a9eff'
    accent_light: '#1d6fd0'
    order: 10
  - id: desk3
    title: HP Microserver
    subtitle: Firewall · 10.0.0.1
    accent: '#f59e0b'
    accent_light: '#b45309'
    order: 20
  endpoints:
  - name: Ollama API
    address: http://ai.home.lan:11434
  - name: LiteLLM API
    address: http://ai.home.lan:4000
  - name: Jarvis · TTS/STT
    address: http://ai.home.lan:8000/v1
  - name: Loki
    address: http://grafana.home.lan:3100
  - name: k3s API
    address: https://k3os0.home.lan:6443
  - name: PostgreSQL
    address: postgres.home.lan:5432
  notes:
  - Os links usam nomes .home.lan resolvidos pelo dnsmasq do firewall — sobrevivem a troca de IP.
  - 'Proxmox, Webmin e o nginx do AI Lab usam certificados self-signed: o navegador vai pedir exceção
    na primeira visita.'
firewall:
  # Entrada fechada: o modelo so aceita 'drop'. Os bloqueios por porta que o HP
  # tinha viraram redundantes; a base (LAN, VPN, established, ICMP) vem do
  # render.base_input.
  input_policy: drop
  forward_policy: drop
  input_rules: []
  forward_rules:
  - enabled: true
    action: accept
    description: LAN sai para qualquer WAN
    proto: any
    source: lan
    destination: wan
    dest_ports: ''
    log: false
    counter: true
  port_forwards: []
  masquerade:
  - wan_star
  - wan_vivo
  preserve_tables:
  - inet f2b-table
