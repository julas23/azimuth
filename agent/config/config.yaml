# Config VIVA do fwadmin. Alterada pela UI; versionada em git.
version: 1
system:
  hostname: fw
  timezone: America/Sao_Paulo
  admin_cidr: 10.0.0.0/24
  confirm_timeout: 90
interfaces:
- name: lan
  device: enp2s0
  role: lan
  description: LAN 10GbE
  ipv4:
    mode: static
    address: 10.0.0.1/24
- name: wan_star
  device: enp3s0
  role: wan
  description: Starlink
  ipv4:
    mode: dhcp
- name: wan_vivo
  device: enp4s0
  role: wan
  description: Vivo Fibra (PPPoE)
  ipv4:
    mode: pppoe
  pppoe:
    peer: vivo
    username: usuario@provedor
    password_ref: vivo
    mtu: 1492
    mru: 1492
    lcp_echo_interval: 20
    lcp_echo_failure: 3
    holdoff: 5
routing:
  primary: wan_vivo
  backup: wan_star
  failover:
    enabled: true
    interval_seconds: 60
    threshold: 3
    ping_targets:
    - 8.8.8.8
    ping_count: 2
    ping_timeout: 2
dns:
  domain: home.lan
  expand_hosts: true
  local_only: true
  bind_interfaces: true
  upstream:
  - 8.8.8.8
  - 1.1.1.1
dhcp:
  enabled: true
  interface: lan
  range:
    start: 10.0.0.10
    end: 10.0.0.200
    netmask: 255.255.255.0
    lease: 12h
  router: 10.0.0.1
  dns_servers:
  - 10.0.0.1
  reservations:
