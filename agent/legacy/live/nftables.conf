#!/usr/sbin/nft -f

# Recria somente as tabelas definidas neste arquivo.
# NAO usar "flush ruleset": apagaria a tabela "inet f2b-table" do fail2ban
# (e todos os IPs banidos) a cada reload.
table inet filter
delete table inet filter
table ip nat
delete table ip nat

define WAN = { "ppp0", "enp3s0" }

table inet filter {
    chain input {
        type filter hook input priority 0; policy accept;

        # Servicos de administracao: acessiveis somente pela LAN (enp2s0)
        iifname $WAN tcp dport 22 counter drop comment "SSH so LAN"
        iifname $WAN tcp dport { 9090, 10000 } counter drop comment "Cockpit/Webmin so LAN"
        iifname $WAN udp dport 10000 counter drop comment "Webmin UDP so LAN"
        iifname $WAN tcp dport { 80, 443 } counter drop comment "Portal nginx so LAN"
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
        ct state established,related accept
        tcp flags syn tcp option maxseg size set rt mtu
        iifname "enp2s0" oifname "enp3s0" accept
        iifname "enp2s0" oifname "ppp0" accept
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority 100; policy accept;
        oifname "enp3s0" masquerade
        oifname "ppp0" masquerade
    }
}
