# ==========================================================================
# == Configurações Básicas
# ==========================================================================
interface=enp2s0
domain=home.lan
expand-hosts
local=/home.lan/

# ==========================================================================
# == Configurações DHCP
# ==========================================================================
dhcp-range=10.0.0.10,10.0.0.200,255.255.255.0,12h
dhcp-option=option:router,10.0.0.1
dhcp-option=6,10.0.0.1

