# /etc/fail2ban/filter.d/azimuth-panel.conf — senha recusada no painel do Azimuth.
#
# O painel escreve no journal (stderr do fwadmin.service) uma linha por senha
# recusada, so com o IP:  "fwadmin: login recusado de 10.0.0.42"
# O nome de usuario fica de fora de proposito: e' texto de quem tenta, e
# numa linha casada por regex poderia forjar o endereco de outra pessoa.

[Definition]
failregex = ^fwadmin: login recusado de <ADDR>$
ignoreregex =
