# /etc/fail2ban/jail.d/azimuth-panel.conf — o painel do Azimuth.
#
# O painel so aceita a LAN e a VPN (FWADMIN_ALLOW), entao quem cai aqui e'
# um aparelho de dentro: um dispositivo comprometido tentando senhas, ou o
# dono errando. Por isso o ban e' so da porta do painel e curto: o aparelho
# continua com internet, SSH e o resto, e quem se trancou entra de outro
# aparelho e desbane pela tela do Fail2Ban.

[azimuth-panel]
enabled  = true
backend  = systemd
journalmatch = _SYSTEMD_UNIT=fwadmin.service
filter   = azimuth-panel
port     = 8443
protocol = tcp
maxretry = 5
findtime = 10m
bantime  = 15m
