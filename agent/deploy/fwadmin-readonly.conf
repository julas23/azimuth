# /etc/systemd/system/fwadmin.service.d/readonly.conf
#
# Gerado pelo install-readonly.sh. Transforma o fwadmin.service completo no
# painel somente leitura, sem nginx na frente:
#
#   - o uvicorn atende direto, com TLS, no IP da LAN — do lado da WAN a porta
#     nem existe;
#   - FWADMIN_ALLOW faz o allow/deny que o nginx faria;
#   - o ReadWritePaths volta ao minimo: sem /etc e sem /usr/local/bin, que so
#     o apply precisa.
#
# Quando o motor completo for instalado, este arquivo sai.

[Unit]
# Bind num IP especifico exige o endereco ja na placa.
After=network-online.target
Wants=network-online.target

[Service]
Environment=FWADMIN_READONLY=1
Environment=FWADMIN_ALLOW=@LAN_NET@
ExecStart=
ExecStart=/usr/bin/python3 -m uvicorn fwadmin.web:app \
    --host @LAN_IP@ --port @PORT@ \
    --ssl-keyfile /var/lib/fwadmin/tls/fwadmin.key \
    --ssl-certfile /var/lib/fwadmin/tls/fwadmin.crt
ReadWritePaths=
ReadWritePaths=/var/lib/fwadmin
