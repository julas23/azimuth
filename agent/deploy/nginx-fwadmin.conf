# /etc/nginx/sites-available/fwadmin
#
# Duas camadas independentes prendem o painel na LAN:
#   1. o listen amarra no IP da LAN — a porta nem existe do lado da WAN;
#   2. o allow/deny recusa qualquer origem fora da rede local.
# A regra de nftables que descarta 80/443 vindos da WAN e' a terceira.

server {
    listen 10.0.0.1:80;
    server_name fw.home.lan portal.home.lan;

    allow 10.0.0.0/24;
    deny all;

    # O painel pede senha; senha em texto claro nao combina nem numa LAN.
    return 301 https://$host$request_uri;
}

server {
    listen 10.0.0.1:443 ssl;
    http2 on;
    server_name fw.home.lan portal.home.lan;

    allow 10.0.0.0/24;
    deny all;

    ssl_certificate     /etc/fwadmin/tls/fwadmin.crt;
    ssl_certificate_key /etc/fwadmin/tls/fwadmin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:fwadmin:1m;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Um formulario grande aqui e' sinal de abuso, nao de uso.
    client_max_body_size 1m;

    access_log /var/log/nginx/fwadmin.access.log;
    error_log  /var/log/nginx/fwadmin.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O apply pode levar bem mais que o padrao: ifdown/ifup e reconexao
        # de PPPoE acontecem durante a requisicao.
        proxy_read_timeout 300s;
    }
}
