# /etc/systemd/system/nginx.service.d/fwadmin.conf
#
# O vhost do fwadmin amarra em 10.0.0.1:80 e :443 — e' isso que faz a porta
# nao existir do lado da WAN. Mas bind num IP especifico so funciona depois
# que a interface tem endereco, e o network.target padrao nao garante isso.
#
# Sem este drop-in, um boot em que o nginx ganhe a corrida do ifup deixa o
# painel fora do ar ate alguem reiniciar o servico na mao.

[Unit]
After=network-online.target networking.service
Wants=network-online.target

[Service]
# Se ainda assim perder a corrida, tenta de novo em vez de desistir.
Restart=on-failure
RestartSec=3
