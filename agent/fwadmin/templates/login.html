{% from "_icons.html" import logo %}
<!doctype html>
<html lang="{{ lang }}" data-theme="{{ theme or 'auto' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Azimuth</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="center">
  <form class="card login" method="post" action="/login">
    <span class="brand">{{ logo() }}<b>Azimuth</b></span>
    <p class="lede" style="margin:0">Administração do firewall. Acessível apenas pela LAN.</p>
    {% if error %}<div class="note bad">{{ error }}</div>{% endif %}
    <div class="field"><label for="u">Usuário</label><input class="input" id="u" name="username" type="text" autocomplete="username" required autofocus></div>
    <div class="field"><label for="p">Senha</label><input class="input" id="p" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn primary" type="submit">Entrar</button>
    {% if readonly %}<p class="muted" style="margin:0;font-size:12.5px">{{ t.readonly }}: {{ t.readonly_hint }}</p>{% endif %}
  </form>
</div>
</body>
</html>
