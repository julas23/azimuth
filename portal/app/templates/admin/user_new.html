{% extends "base.html" %}
{% block title %}Novo usuário — Admin{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto px-4 py-10">

  <div class="mb-6">
    <a href="/admin/users" class="text-sm text-gray-500 hover:text-indigo-600">← Usuários</a>
    <h1 class="text-2xl font-bold text-gray-900 mt-1">Novo usuário</h1>
  </div>

  {% if error %}
  <div class="mb-4 bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 text-sm">
    {{ error }}
  </div>
  {% endif %}

  <div class="bg-white rounded-2xl border border-gray-200 p-6">
    <form method="post" action="/admin/users/new" class="space-y-4">

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nome</label>
        <input type="text" name="name" value="{{ form.name }}" required autofocus
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
        <input type="email" name="email" value="{{ form.email }}" required
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Senha inicial</label>
        <input type="password" name="password" required minlength="8"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <p class="text-xs text-gray-400 mt-1">Mínimo 8 caracteres. O usuário poderá alterar depois.</p>
      </div>

      <div class="flex items-center gap-2 pt-1">
        <input type="checkbox" name="is_admin" value="1" id="is_admin"
               class="w-4 h-4 rounded border-gray-300 text-indigo-600">
        <label for="is_admin" class="text-sm text-gray-700 cursor-pointer">Administrador</label>
      </div>

      <div class="pt-2 flex gap-3">
        <button type="submit"
                class="bg-indigo-600 text-white px-6 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">
          Criar usuário
        </button>
        <a href="/admin/users"
           class="px-6 py-2 rounded-lg text-sm font-medium border border-gray-300 text-gray-600 hover:bg-gray-50 transition">
          Cancelar
        </a>
      </div>

    </form>
  </div>

</div>
{% endblock %}
