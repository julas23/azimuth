{% extends "base.html" %}
{% block title %}{{ t.page_title_password }}{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-12">
  <div class="bg-white rounded-2xl border border-gray-200 p-8 w-full max-w-md">

    <div class="mb-6">
      <h1 class="text-xl font-bold text-gray-900">{{ t.pwd_title }}</h1>
      <p class="text-sm text-gray-500 mt-1">{{ t.pwd_desc }}</p>
    </div>

    {% if forced %}
    <div class="mb-4 bg-amber-50 border border-amber-200 text-amber-800 rounded-lg px-4 py-3 text-sm">
      {{ t.pwd_forced_notice }}
    </div>
    {% endif %}

    {% if error %}
    <div class="mb-4 bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 text-sm">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/account/password" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t.pwd_current_label }}</label>
        <input type="password" name="current_password" required autofocus
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t.pwd_new_label }}</label>
        <input type="password" name="new_password" required minlength="8"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t.pwd_confirm_label }}</label>
        <input type="password" name="confirm_password" required minlength="8"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <button type="submit"
              class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-lg hover:bg-indigo-700 transition text-sm">
        {{ t.pwd_button }}
      </button>
    </form>

    {% if not forced %}
    <div class="mt-4 text-center">
      <a href="/dashboard" class="text-sm text-gray-500 hover:text-gray-700">{{ t.pwd_back }}</a>
    </div>
    {% endif %}

  </div>
</div>
{% endblock %}
