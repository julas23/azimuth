#!/usr/sbin/nft -f
# /etc/nftables.conf do primeiro boot do Azimuth.
#
# Entrada fechada: a caixa nasce sem servico configurado, e nada alem do
# necessario para alcanca-la deve responder. O motor convive com este arquivo
# (a tabela dele e' a 'inet azimuth') e pode absorve-lo pelo painel.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        iifname "lo" accept
        ct state established,related accept
        ct state invalid drop
        meta l4proto { icmp, ipv6-icmp } accept

        # DHCP cliente: a resposta do servidor da rede onde a caixa esta
        udp sport 67 udp dport 68 accept

        # SSH e o painel (80/443 pelo nginx, 8443 no modo enxuto)
        tcp dport { 22, 80, 443, 8443 } accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
