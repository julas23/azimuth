# Preseed do Azimuth para o debian-installer (Debian 13).
#
# Instala sem internet: a base vem do proprio CD e os pacotes do Azimuth de um
# repositorio dentro da ISO (/azimuth/pool), pelo late.sh. Perguntas que
# sobram de proposito: qual disco apagar e a senha do usuario.

# --- idioma, teclado, fuso -------------------------------------------------
d-i debian-installer/locale string pt_BR.UTF-8
d-i debian-installer/language string pt
d-i debian-installer/country string BR
d-i localechooser/supported-locales multiselect en_US.UTF-8, pt_BR.UTF-8
d-i keyboard-configuration/xkb-keymap select br
d-i keyboard-configuration/layoutcode string br
d-i console-setup/ask_detect boolean false
d-i time/zone string America/Sao_Paulo
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean false

# --- rede ------------------------------------------------------------------
# DHCP na primeira placa que tiver link. Sem lease, segue sem rede: a
# instalacao nao precisa de internet.
d-i netcfg/choose_interface select auto
d-i netcfg/link_wait_timeout string 10
d-i netcfg/dhcp_timeout string 20
d-i netcfg/dhcp_failed note
d-i netcfg/dhcp_options select Do not configure the network at this time
d-i netcfg/get_hostname string azimuth
d-i netcfg/get_domain string lan
d-i netcfg/hostname string azimuth
d-i netcfg/wireless_wep string
d-i hw-detect/load_firmware boolean true

# --- espelho: nenhum --------------------------------------------------------
# Tudo vem do CD. O late.sh deixa o /etc/apt apontando para deb.debian.org,
# para as atualizacoes de depois.
d-i apt-setup/use_mirror boolean false
d-i apt-setup/no_mirror boolean true
d-i apt-setup/services-select multiselect
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean false
d-i apt-setup/contrib boolean false
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# --- usuario ----------------------------------------------------------------
# Sem senha de root: root nao entra nem no console nem no painel. O nome do
# usuario e a senha sao perguntados; ele entra no grupo sudo, sem senha
# (late.sh), e e' com ele que se entra no painel (PAM). O nome completo vai
# respondido so para o instalador nao perguntar: dele sai a sugestao
# 'administrador' para o nome do usuario.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Administrador
d-i passwd/user-default-groups string audio cdrom video plugdev netdev sudo

# --- disco ------------------------------------------------------------------
# O disco e' perguntado (partman-auto/disk fica sem resposta). O LVM e' so dos
# dados (STORAGE.md, principio 7): o sistema leva ate 32 GiB e 4 GiB de swap, e
# o resto do disco fica livre para uma particao de dados, se esta caixa nao
# tiver disco de dados proprio.
d-i partman-auto/method string regular
d-i partman-auto/expert_recipe string                         \
      azimuth ::                                              \
              1 1 1 free                                      \
                      $bios_boot{ }                           \
                      method{ biosgrub } .                    \
              538 538 1075 free                               \
                      $iflabel{ gpt }                         \
                      $reusemethod{ }                         \
                      method{ efi }                           \
                      format{ } .                             \
              20480 32768 32768 ext4                          \
                      $primary{ } $bootable{ }                \
                      method{ format } format{ }              \
                      use_filesystem{ } filesystem{ ext4 }    \
                      mountpoint{ / } .                       \
              4096 4096 4096 linux-swap                       \
                      method{ swap } format{ } .
d-i partman-auto/choose_recipe select azimuth
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true
d-i partman-basicfilesystems/no_swap boolean false

# --- pacotes ---------------------------------------------------------------
# So a base: o resto vem do repositorio da ISO, no late.sh.
d-i base-installer/install-recommends boolean false
d-i base-installer/kernel/image string linux-image-amd64
tasksel tasksel/first multiselect
d-i pkgsel/include string
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none
popularity-contest popularity-contest/participate boolean false

# --- carregador ------------------------------------------------------------
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default

# --- fim -------------------------------------------------------------------
d-i preseed/late_command string sh /cdrom/azimuth/late.sh
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true
